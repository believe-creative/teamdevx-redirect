<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <link rel="canonical" href="https://believecreative.com">
  <meta http-equiv="refresh" content="0; url=https://believecreative.com">
  <script>
    var targetDomain = "www.believecreative.com";
    // Only redirect if the user is NOT already on the target domain
    if (window.location.hostname !== targetDomain) {
      window.location.replace("https://" + targetDomain + window.location.pathname + window.location.search);
    }
  </script>
</head>
<body>
  <p>If you are not redirected, <a href="https://believecreative.com">click here</a>.</p>
</body>
</html>
